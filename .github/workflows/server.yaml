name: server

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poetry
        run: pip install poetry==1.8.3

      - name: Configure poetry
        run: poetry config virtualenvs.in-project true

      - name: Install project
        run: poetry install --no-root --with dev,test

      - name: Lint (ruff)
        run: poetry run ruff check app tests

      - name: Type check (mypy)
        run: poetry run mypy app --ignore-missing-imports

      - name: Tests
        run: poetry run pytest -v

  build-image:
    runs-on: ubuntu-latest
    needs: test
    # Build on develop and main, like ds-login: a fix merged to main gets an
    # image (…-dev.<run>.main.<sha>) without first syncing develop.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the versioned+SHA tag that matches every other ds-* service
      # (e.g. ds-contract-generator:0.1.0-dev.11.develop.0cce022a).
      # Immutable + stable, so gitops overlays can pin to it with
      # pullPolicy: IfNotPresent and never hit ghcr's anonymous rate-limit
      # on pod restart.
      - name: Compute image tag
        id: tag
        run: |
          APP_VERSION=$(sed -nE 's/^appVersion:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' \
            server/charts/ds-credential-issuer/Chart.yaml)
          BRANCH=${GITHUB_REF_NAME}
          SHORT_SHA=${GITHUB_SHA:0:8}
          VERSIONED="${APP_VERSION}-dev.${GITHUB_RUN_NUMBER}.${BRANCH}.${SHORT_SHA}"
          echo "versioned=${VERSIONED}" >> "$GITHUB_OUTPUT"
          echo "Built tag: ${VERSIONED}"

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/hiro-microdatacenters-bv/ds-credential-issuer:${{ github.ref_name }}
            ghcr.io/hiro-microdatacenters-bv/ds-credential-issuer:${{ github.sha }}
            ghcr.io/hiro-microdatacenters-bv/ds-credential-issuer:${{ steps.tag.outputs.versioned }}
