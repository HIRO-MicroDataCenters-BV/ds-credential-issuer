name: server

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.6"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium23 libsodium-dev

      - name: Install poetry
        run: pip install poetry==1.8.3

      - name: Configure poetry
        run: poetry config virtualenvs.in-project true

      - name: Install project
        run: poetry install --no-root --with dev,test

      - name: Lint (ruff)
        run: poetry run ruff check app tests

      - name: Type check (mypy)
        run: poetry run mypy app --ignore-missing-imports

      - name: Tests
        run: poetry run pytest -v

  build-image:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/hiro-microdatacenters-bv/ds-credential-issuer:develop
            ghcr.io/hiro-microdatacenters-bv/ds-credential-issuer:${{ github.sha }}
