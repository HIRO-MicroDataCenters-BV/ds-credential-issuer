apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: ds-credential-issuer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    # Single writer against the KERI LMDB — rolling update would race on
    # the shared PVC. Recreate is correct for this stateful service.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ds-credential-issuer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ds-credential-issuer
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The container runs as the Dockerfile's dsiss user (uid 1000). The
      # mounted PVC comes up owned by root unless Kubernetes recursively
      # chowns it on mount — fsGroup triggers that chown. Without this the
      # app crashes with PermissionError: '/var/lib/ds-credential-issuer/keystore'.
      # Use `dig` so the render survives if a site overlay sets
      # podSecurityContext: {} (nil .fsGroup) or omits the whole key.
      securityContext:
        fsGroup: {{ dig "fsGroup" 1000 (.Values.podSecurityContext | default dict) }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DS__ISSUER__NAME
              value: {{ .Values.issuer.name | quote }}
            - name: DS__ISSUER__HABERY_PATH
              value: {{ .Values.issuer.haberyPath | quote }}
            # dkms-bin facade (Phase 1) ---------------------------------
            - name: DS__ISSUER__DKMS_WITNESS_URL
              value: {{ .Values.issuer.dkmsWitnessUrl | quote }}
            - name: DS__ISSUER__DKMS_WATCHER_URL
              value: {{ .Values.issuer.dkmsWatcherUrl | quote }}
            - name: DS__ISSUER__DKMS_WITNESS_THRESHOLD
              value: {{ .Values.issuer.dkmsWitnessThreshold | quote }}
            - name: DS__ISSUER__DKMS_HOME
              value: {{ .Values.issuer.dkmsHome | quote }}
            - name: DS__ISSUER__DEFAULT_OCA_BUNDLE_SAID
              value: {{ .Values.issuer.defaultOcaBundleSaid | quote }}
            # Legacy KERIpy settings — kept for backward-compat during the
            # migration; the dkms-bin path above overrides their behaviour.
            - name: DS__ISSUER__WITNESS_URLS
              value: {{ toJson .Values.issuer.witnessUrls | quote }}
            - name: DS__ISSUER__WITNESS_AIDS
              value: {{ toJson .Values.issuer.witnessAids | quote }}
            - name: DS__ISSUER__WITNESS_OOBI_BASES
              value: {{ toJson .Values.issuer.witnessOobiBases | quote }}
            - name: DS__ISSUER__WITNESS_OOBIS
              value: {{ toJson .Values.issuer.witnessOobis | quote }}
            - name: DS__ISSUER__MESAGKESTO_URL
              value: {{ .Values.issuer.mesagkestoUrl | quote }}
            - name: DS__ISSUER__INCEPTION_THRESHOLD
              value: {{ .Values.issuer.inceptionThreshold | quote }}
            {{- if .Values.auth.enabled }}
            - name: DS__AUTH__ENABLED
              value: "true"
            - name: DS__AUTH__JWKS_URL
              value: {{ .Values.auth.jwksUrl | quote }}
            - name: DS__AUTH__POLICY_ENGINE_URL
              value: {{ .Values.auth.policyEngineUrl | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          readinessProbe:
            httpGet:
              path: /health-check/
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health-check/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: ds-credential-issuer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: ds-credential-issuer
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: ds-credential-issuer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    {{- range .Values.persistence.accessModes }}
    - {{ . | quote }}
    {{- end }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
