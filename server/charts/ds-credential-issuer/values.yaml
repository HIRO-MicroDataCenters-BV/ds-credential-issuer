# Defaults for ds-credential-issuer. Site overrides live in ds-gitops.

image:
  repository: ghcr.io/hiro-microdatacenters-bv/ds-credential-issuer
  tag: "develop"
  pullPolicy: IfNotPresent

replicaCount: 1   # single writer against dkms-bin's store and SQLite; do not scale

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ""
  tls:
    enabled: false
    secretName: ""

# Issuer identity + DKMS wiring. Shape mirrors app.settings.Issuer.
# Phase 1 of the facade pivot delegates AID lifecycle + grant OOBI
# publication + ACDC minting to HCF's `dkms` CLI (baked into the image).
# dkmsWitnessUrl and dkmsWatcherUrl must point at this site's keriox
# witness/watcher Services; dkms-bin takes care of inception, witness
# receipting and watcher subscription on first boot.
issuer:
  name: ds-credential-issuer
  dkmsWitnessUrl: ""
  dkmsWatcherUrl: ""
  dkmsWitnessThreshold: 1
  dkmsHome: /var/lib/ds-credential-issuer/dkms
  defaultOcaBundleSaid: ""
  mesagkestoUrl: ""
  inceptionThreshold: 1
  # The site this issuer belongs to (hus, ki, uva; hiro on local kind). Every
  # credential's `institute` is this value; a request asking for another site
  # is refused. Empty = the request's value is used as is.
  institute: ""
  # One-time first-admin bootstrap (POST /bootstrap/operator). Name of a Secret
  # with key `token` (>= 32 chars). Empty = endpoint off. Remove after use.
  bootstrapTokenSecret: ""
  # Role of the credential the bootstrap issues.
  bootstrapRole: site_admin

persistence:
  enabled: true
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  size: 1Gi
  mountPath: /var/lib/ds-credential-issuer

env:
  DS__ENVIRONMENT: production
  DS__LOG_LEVEL: INFO

# Optional ds-auth gating — same shape as ds-policy-engine / ds-catalog.
auth:
  enabled: false
  jwksUrl: ""
  policyEngineUrl: ""

# Pod-level securityContext. fsGroup makes the mounted PVC writable by
# the Dockerfile's dsiss user (uid 1000). Keep as a dict so the template
# can safely access .podSecurityContext.fsGroup even when a site overlay
# doesn't touch it — a missing path here nil-pointers in Helm render.
podSecurityContext:
  fsGroup: 1000

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
