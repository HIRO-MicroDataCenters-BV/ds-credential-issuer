# Defaults for ds-credential-issuer. Site overrides live in ds-gitops.

image:
  repository: ghcr.io/hiro-microdatacenters-bv/ds-credential-issuer
  tag: "develop"
  pullPolicy: IfNotPresent

replicaCount: 1   # single-writer against the KERI LMDB; do not scale

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ""
  tls:
    enabled: false
    secretName: ""

# Issuer identity + DKMS wiring. Shape mirrors app.settings.Issuer.
# Required: witnessAids must list the AID(s) of the configured witness(es)
# so the issuer actually anchors there; otherwise verifiers can't resolve
# the issuer's KEL and every grant verification fails.
issuer:
  name: ds-credential-issuer
  haberyPath: /var/lib/ds-credential-issuer/keystore
  witnessUrls: []        # internal URLs — where this pod POSTs events
  witnessAids: []        # AIDs of those witnesses (position matches witnessUrls)
  witnessOobiBases: []   # external bases for OOBI resolution; empty = use witnessUrls
  witnessOobis: []       # DEPRECATED: pre-computed OOBI URLs. Prefer witnessOobiBases.
  mesagkestoUrl: ""
  inceptionThreshold: 1

persistence:
  enabled: true
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  size: 1Gi
  mountPath: /var/lib/ds-credential-issuer

env:
  DS__ENVIRONMENT: production
  DS__LOG_LEVEL: INFO

# Optional ds-auth gating — same shape as ds-policy-engine / ds-catalog.
auth:
  enabled: false
  jwksUrl: ""
  policyEngineUrl: ""

# Pod-level securityContext. fsGroup makes the mounted PVC writable by
# the Dockerfile's dsiss user (uid 1000). Keep as a dict so the template
# can safely access .podSecurityContext.fsGroup even when a site overlay
# doesn't touch it — a missing path here nil-pointers in Helm render.
podSecurityContext:
  fsGroup: 1000

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
