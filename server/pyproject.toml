[tool.poetry]
name = "ds-credential-issuer"
version = "0.1.0"
description = "Per-node ACDC credential issuer. Mints verifiable credentials, anchors them to a KERI TEL registry, and delivers IPEX grants."
readme = "README.md"
authors = ["HIRO-MicroDataCenters <all-hiro@hiro-microdatacenters.nl>"]
license = "MIT"
repository = "https://github.com/HIRO-MicroDataCenters-BV/ds-credential-issuer"
packages = [{ include = "*", from = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
pydantic = "^2.9"
pydantic-settings = "^2.5"
httpx = "^0.27"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
aiosqlite = "^0.20"
# Optional — only used when DS__AUTH__ENABLED=true. Keeps the service
# backward compatible with the unauthenticated bootstrap flow.
ds-auth = { git = "https://github.com/HIRO-MicroDataCenters-BV/ds-auth.git", rev = "develop", optional = true }

[tool.poetry.extras]
auth = ["ds-auth"]

[tool.poetry.group.dev.dependencies]
ruff = "^0.1"
mypy = "^1.5"

[tool.poetry.group.test.dependencies]
pytest = "^7"
pytest-asyncio = "^0.21"
pytest-cov = "^4"
respx = "^0.20"
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom uses Depends(...) in argument
# defaults; B008 would reject every route handler.
"app/rest_api/routes/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
